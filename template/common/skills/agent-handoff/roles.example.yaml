# Role templates for handoff-start / handoff-finish (agent-handoff loop).
# Copied to <main worktree>/.agent-handoff/roles.yaml only when that file is missing;
# it is ignored by Git, so edit it freely for this repository.
#
# Format: "key: value" lines, at most two levels (role -> field). Values are one line.
# Every role must set harness, model, effort, name and prompt.
# Placeholders: {change} {head} {round} {report} {delivery} {handoff_write} {author}
# {author} becomes one sentence telling the agent to append the output of
# scripts/handoff-author (tool and template model; Session IDs copied from the environment).
# Skill syntax differs by tool: Claude Code uses /skill, Codex uses $skill, Pi uses /skill:<name>.

max_rounds: 3

# Session host: where the roles' sessions run. xirp (default), herdr or herdr-app; a role can set its own
# host: line to override this one. herdr is the herdr terminal UI; herdr-app is the Herdr desktop app,
# which must be open (its sessions run in herdr-core, hc). herdr_session names the herdr session used when
# a loop starts outside herdr (inside a herdr pane, that pane's session is used); default: herdr's default session.
# host: herdr
# herdr_session: work

implement:
  harness: claude
  model: opus
  effort: high
  name: "claude - impl - {change}"
  prompt: "/openspec-apply-change {change}。這是第 {round} 輪；若有審查報告，先讀 {report}。測試通過後本機 commit（第一輪 feat({change}): <摘要>，修正輪 fix({change}): address <review-id>），不要 push。最後執行 {handoff_write} --change {change} --role implement --status done --head HEAD；無法完成時改用 --status blocked 並以 --note 說明。{author}"

review:
  worktree: shared
  harness: codex
  model: gpt-6.1-sol
  effort: high
  name: "codex - review - {change}"
  prompt: "$change-review {change}：這是交接迴圈第 {round} 輪的實作審查，受審版本為 commit {head}。依 agent-handoff Skill，結束時以 {handoff_write} --change {change} --role review 記錄結果。實作者由 handoff hook 通知，你不需要也不要自己傳訊；這不是排除通知，結論照常以 --status done 記錄。{author}"

# finish.delivery: pr pushes and writes to GitHub. Codex's default sandbox has no network,
# so give a Codex finish role the profile created by scripts/handoff/install.sh:
#   profile: handoff-net
# (~/.codex/handoff-net.config.toml: workspace-write sandbox with network access).
# SSH pushes still need Codex's approval to leave the sandbox; HTTPS remotes work inside it.
finish:
  worktree: shared
  trigger: ask
  delivery: local
  harness: codex
  model: gpt-5.6-terra
  effort: medium
  name: "codex - finish - {change}"
  prompt: "$openspec-commit {change}。封存時若有待同步的 delta spec，直接同步主規格後封存，不需詢問。交付方式：{delivery}（local 只做本地封存、文件與 commit；pr 已授權 push、github-pr update、以交付後的 head 做最終版 Review，通過才發 ready-to-merge Closure）。完成或中斷時依 agent-handoff Skill 以 {handoff_write} --change {change} --role finish 記錄結果。{author}"

# --- Pi role example ---
# A role can run in Pi (harness: pi). A Pi role also sets provider and billing:
#   provider  the Pi provider that owns the model (pi --list-models <model> lists every provider)
#   model     the exact model ID under that provider, without "provider/" and without aliases
#   effort    Pi thinking level: off, minimal, low, medium, high, xhigh, max
#   billing   subscription (the provider is logged in with OAuth, e.g. openai-codex)
#             or api (the provider uses an API key, e.g. openai)
# handoff-start and the hook refuse a Pi role whose model is not listed under the provider, whose
# credential is not ready, or whose credential type does not match billing. Anthropic with
# billing: subscription is allowed, but may consume paid extra usage; handoff-start warns.
# The role starts from .pi/settings.json written into its worktree (ignored through info/exclude),
# so a worktree holds at most one Pi role: give a second Pi role worktree: new.
# Pi roles need scripts/handoff/install.sh (the Pi trigger) and /trust run in Pi in the main worktree.
# To use it, replace the review section above with:
#
# review:
#   worktree: new
#   harness: pi
#   provider: openai-codex
#   model: gpt-6.2-sol
#   effort: high
#   billing: subscription
#   name: "pi - review - {change}"
#   prompt: "/skill:change-review {change}：這是交接迴圈第 {round} 輪的實作審查，受審版本為 commit {head}。依 agent-handoff Skill，結束時以 {handoff_write} --change {change} --role review 記錄結果。實作者由 handoff hook 通知，你不需要也不要自己傳訊；這不是排除通知，結論照常以 --status done 記錄。{author}"
# --- end of Pi role example ---
