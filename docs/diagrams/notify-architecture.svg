<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1160" viewBox="0 0 1440 1160" role="img" aria-labelledby="title desc">
<title id="title">AI CLI 通知架構與延遲授權流程圖</title>
<desc id="desc">展示 Claude Code、Codex、Antigravity CLI、Pi、Copilot CLI 與 Agent Handoff 的事件輸入、四類通知分流、30 秒延遲授權狀態機、範本替換引擎與 Telegram Bot API 派送流程。</desc>
<defs>
<marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0 L14 7 L0 14 Z" fill="#647a94"/></marker>
<marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0 L14 7 L0 14 Z" fill="#1d4ed8"/></marker>
<marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0 L14 7 L0 14 Z" fill="#1f7a4d"/></marker>
<marker id="arrow-red" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0 L14 7 L0 14 Z" fill="#b42318"/></marker>
<marker id="arrow-orange" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0 L14 7 L0 14 Z" fill="#d97706"/></marker>
</defs>

<rect width="1440" height="1160" fill="#f8fafc"/>
<g font-family="PingFang TC, Noto Sans CJK TC, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">

<!-- 頂部標題與狀態膠囊 -->
<text x="40" y="55" font-size="28" fill="#0f172a" font-weight="700">AI CLI 通知系統架構與延遲授權流程 (Notify Architecture &amp; Delayed Authorization)</text>
<text x="40" y="85" font-size="15" fill="#475569">跨 Provider 事件正規化 · 30 秒授權防誤報機制 · 範本化訊息 · 包含交接迴圈（Agent Handoff）進度流</text>
<rect x="1240" y="32" width="160" height="36" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
<text x="1320" y="55" font-size="14" fill="#0369a1" font-weight="600" text-anchor="middle">已實作 · 核心架構</text>

<!-- 區域 1：多 Provider 事件輸入源 -->
<rect x="40" y="115" width="1360" height="210" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="40" y="115" width="1360" height="42" rx="14" fill="#0f172a"/>
<text x="60" y="142" font-size="17" fill="#ffffff" font-weight="700">1. 多 AI Provider 原生事件接入層 (Native Event Inputs)</text>

<!-- Claude Code -->
<rect x="55" y="170" width="250" height="135" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<text x="70" y="195" font-size="15" fill="#0f172a" font-weight="700">Claude Code</text>
<text x="70" y="218" font-size="13" fill="#334155">• <tspan font-family="monospace" font-weight="600">Stop</tspan> → 完成通知</text>
<text x="70" y="238" font-size="13" fill="#334155">• <tspan font-family="monospace" font-weight="600">Notification</tspan>:</text>
<text x="85" y="256" font-size="12" fill="#64748b">permission_prompt (授權·延遲)</text>
<text x="85" y="274" font-size="12" fill="#0369a1">AskUserQuestion / idle (提問·立即)</text>
<text x="85" y="292" font-size="11" fill="#94a3b8">auth / quota (資訊類·靜默過濾)</text>

<!-- Codex -->
<rect x="320" y="170" width="255" height="135" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<text x="335" y="195" font-size="15" fill="#0f172a" font-weight="700">Codex CLI / Daemon</text>
<text x="335" y="218" font-size="13" fill="#334155">• <tspan font-family="monospace" font-weight="600">Stop</tspan> → 完成通知</text>
<text x="335" y="238" font-size="13" fill="#b42318">• <tspan font-family="monospace" font-weight="600">PermissionRequest</tspan> (授權·延遲)</text>
<text x="335" y="258" font-size="13" fill="#334155">• <tspan font-family="monospace" font-weight="600">PostToolUse</tspan> (非同步提問·立即)</text>
<text x="335" y="278" font-size="13" fill="#334155">• <tspan font-family="monospace" font-weight="600">PreToolUse</tspan> (同步提問·立即)</text>
<text x="335" y="295" font-size="11" fill="#64748b">CLI 獨立 session 自動回退紀錄探針</text>

<!-- Antigravity -->
<rect x="590" y="170" width="255" height="135" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<text x="605" y="195" font-size="15" fill="#0f172a" font-weight="700">Antigravity CLI</text>
<text x="605" y="218" font-size="13" fill="#334155">• <tspan font-family="monospace" font-weight="600">Stop</tspan> (完成判定):</text>
<text x="620" y="238" font-size="12" fill="#1f7a4d">NO_TOOL_CALL + fullyIdle (成功)</text>
<text x="620" y="256" font-size="12" fill="#64748b">USER_CANCELED (主動取消·靜默)</text>
<text x="605" y="276" font-size="13" fill="#b42318">• <tspan font-family="monospace" font-weight="600">statusLine</tspan> (授權·延遲):</text>
<text x="620" y="294" font-size="11" fill="#64748b">tool_confirmation_pending: true</text>

<!-- Agent Handoff -->
<rect x="860" y="170" width="265" height="135" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
<text x="875" y="195" font-size="15" fill="#166534" font-weight="700">Agent Handoff (交接迴圈)</text>
<text x="875" y="218" font-size="13" fill="#15803d">• 實作交件: <tspan font-family="monospace">handoff-implement</tspan></text>
<text x="875" y="238" font-size="13" fill="#15803d">• 審查通過: <tspan font-family="monospace">handoff-review-pass</tspan></text>
<text x="875" y="258" font-size="13" fill="#15803d">• 審查退回: <tspan font-family="monospace">handoff-review-changes</tspan></text>
<text x="875" y="278" font-size="13" fill="#15803d">• 收尾結束: <tspan font-family="monospace">handoff-finish</tspan></text>
<text x="875" y="295" font-size="12" fill="#b42318">🚨 需要你處理 (不可關閉保護)</text>

<!-- Pi and Copilot -->
<rect x="1140" y="170" width="245" height="135" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<text x="1155" y="195" font-size="15" fill="#0f172a" font-weight="700">Pi / GitHub Copilot CLI</text>
<text x="1155" y="217" font-size="12" fill="#334155">• Pi global extension：</text>
<text x="1170" y="235" font-size="11" fill="#1f7a4d">agent_settled → 完成 / 異常停止</text>
<text x="1170" y="252" font-size="11" fill="#a16207">ui_prompt_start → 等待回應（無授權）</text>
<text x="1155" y="273" font-size="12" fill="#334155">• Copilot <tspan font-family="monospace" font-weight="600">sessionEnd</tspan> → 完成</text>
<text x="1155" y="292" font-size="12" fill="#334155">• <tspan font-family="monospace" font-weight="600">userPromptSubmitted</tspan> → 等待回應</text>

<!-- 往下連線 -->
<path d="M 720 325 V 360" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

<!-- 區域 2：核心解析與查表分流 -->
<rect x="40" y="365" width="1360" height="185" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="40" y="365" width="1360" height="38" rx="14" fill="#1e293b"/>
<text x="60" y="391" font-size="16" fill="#ffffff" font-weight="700">2. 核心分發器與事件查表 (Core Dispatcher &amp; Event Table Lookup)</text>

<!-- 查表解析方塊 -->
<rect x="65" y="418" width="370" height="115" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
<text x="80" y="442" font-size="14" fill="#0f172a" font-weight="700">telegram-notify.sh + events.tsv</text>
<text x="80" y="465" font-size="12" fill="#475569">• 解析輸入 JSON Payload (stdin) 與工具參數 ($2)</text>
<text x="80" y="485" font-size="12" fill="#475569">• 依據 <tspan font-family="monospace" font-weight="600">events.tsv</tspan> 將原生事件轉譯為四類核心或交接事件</text>
<text x="80" y="505" font-size="12" fill="#475569">• 檢查 <tspan font-family="monospace">~/.config/ai-notify/config</tspan> 獨立開關設定</text>
<text x="80" y="523" font-size="11" fill="#0369a1">支援舊設定鍵自動相容轉換 (ACTION_REQUIRED → AUTHORIZATION)</text>

<!-- 4 大類 + 交接開關分流 -->
<rect x="465" y="418" width="915" height="115" rx="10" fill="#fafafa" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="480" y="440" font-size="13" fill="#64748b" font-weight="600">事件分類與開關矩陣 (Category Switches)</text>

<!-- Completion -->
<rect x="480" y="450" width="170" height="72" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
<text x="490" y="472" font-size="13" fill="#065f46" font-weight="700">🟢 工作結束</text>
<text x="490" y="492" font-size="11" fill="#047857">NOTIFY_COMPLETION</text>
<text x="490" y="510" font-size="11" fill="#475569">立即派送 · 不延遲</text>

<!-- User Input -->
<rect x="660" y="450" width="170" height="72" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="1"/>
<text x="670" y="472" font-size="13" fill="#854d0e" font-weight="700">🟡 等待回應 / 提問</text>
<text x="670" y="492" font-size="11" fill="#a16207">NOTIFY_USER_INPUT</text>
<text x="670" y="510" font-size="11" fill="#475569">立即派送 · 不延遲</text>

<!-- Failure -->
<rect x="840" y="450" width="170" height="72" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
<text x="850" y="472" font-size="13" fill="#991b1b" font-weight="700">⚪ 異常停止</text>
<text x="850" y="492" font-size="11" fill="#b91c1c">NOTIFY_FAILURE</text>
<text x="850" y="510" font-size="11" fill="#475569">立即派送 · 附原因標籤</text>

<!-- Handoff -->
<rect x="1020" y="450" width="175" height="72" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
<text x="1030" y="472" font-size="13" fill="#1e40af" font-weight="700">🔵 交件單通知</text>
<text x="1030" y="492" font-size="11" fill="#1d4ed8">NOTIFY_HANDOFF_*</text>
<text x="1030" y="510" font-size="11" fill="#475569">實作/審查/收尾分開關</text>

<!-- Authorization (需延遲) -->
<rect x="1205" y="450" width="165" height="72" rx="6" fill="#fef2f2" stroke="#b42318" stroke-width="1.8"/>
<text x="1215" y="472" font-size="13" fill="#b42318" font-weight="700">🔴 授權要求</text>
<text x="1215" y="492" font-size="11" fill="#991b1b">NOTIFY_AUTHORIZATION</text>
<text x="1215" y="510" font-size="11" fill="#b42318" font-weight="600">進入 30 秒延遲確認 ➔</text>

<!-- 雙向路徑箭頭 -->
<!-- 即時路徑往下 -->
<path d="M 750 550 V 820" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
<text x="635" y="670" font-size="13" fill="#047857" font-weight="600">非授權類 · 立即通知 (Immediate Path)</text>

<!-- 授權路徑往延遲引擎 -->
<path d="M 1285 522 V 570 H 1220" fill="none" stroke="#b42318" stroke-width="2.5" marker-end="url(#arrow-red)"/>

<!-- 區域 3：延遲授權確認狀態機 -->
<rect x="690" y="575" width="710" height="230" rx="14" fill="#ffffff" stroke="#b42318" stroke-width="2"/>
<rect x="690" y="575" width="710" height="38" rx="14" fill="#991b1b"/>
<text x="710" y="601" font-size="16" fill="#ffffff" font-weight="700">3. 延遲授權確認狀態機 (Delayed Authorization Engine, 預設 30 秒)</text>

<!-- 狀態機三大步驟 -->
<rect x="705" y="625" width="215" height="165" rx="8" fill="#fffaf0" stroke="#fed7aa" stroke-width="1.2"/>
<text x="715" y="648" font-size="14" fill="#9a3412" font-weight="700">步驟 1：建立等待標記</text>
<text x="715" y="670" font-size="12" fill="#431407">• 取得 Session 檔案鎖</text>
<text x="715" y="688" font-size="12" fill="#431407">• 寫入 <tspan font-family="monospace">state/&lt;tool&gt;-&lt;id&gt;.pending</tspan></text>
<text x="715" y="706" font-size="12" fill="#431407">• 綁定 Wait ID (等待身分)</text>
<text x="715" y="724" font-size="12" fill="#431407">• 重複訊號不重置計時器</text>
<text x="715" y="744" font-size="11" fill="#78350f">啟動獨立背景等待程序</text>
<text x="715" y="762" font-size="11" fill="#78350f">sleep $NOTIFY_DELAY (30s)</text>

<path d="M 920 705 H 940" fill="none" stroke="#9a3412" stroke-width="2" marker-end="url(#arrow-orange)"/>

<rect x="945" y="625" width="225" height="165" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<text x="955" y="648" font-size="14" fill="#0f172a" font-weight="700">步驟 2：30 秒到期複查</text>
<text x="955" y="670" font-size="12" fill="#334155">持鎖重新檢驗等待身分：</text>
<text x="955" y="690" font-size="11" fill="#0369a1">• Claude: transcript 尾端 tool_use</text>
<text x="955" y="708" font-size="11" fill="#0369a1">• Codex: daemon waiting 旗標</text>
<text x="965" y="724" font-size="10" fill="#64748b">(離線或 CLI 則探針 rollout 紀錄)</text>
<text x="955" y="742" font-size="11" fill="#0369a1">• Antigravity: statusLine 是否仍存在</text>
<text x="955" y="762" font-size="11" fill="#64748b">(欄位消失代表已批准/拒絕)</text>

<path d="M 1170 705 H 1190" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="1195" y="625" width="190" height="165" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
<text x="1205" y="648" font-size="14" fill="#166534" font-weight="700">步驟 3：判定結果分流</text>
<text x="1205" y="672" font-size="12" fill="#166534">A. 已被自動放行/解除：</text>
<text x="1215" y="690" font-size="11" fill="#047857">➔ 清理標記，靜默結束</text>
<text x="1215" y="706" font-size="10" fill="#047857">(消除 99.5% 假警報！)</text>
<text x="1205" y="726" font-size="12" fill="#b42318">B. 確實仍在等候人類：</text>
<text x="1215" y="744" font-size="11" fill="#b42318">➔ 送出授權通知</text>
<text x="1215" y="760" font-size="10" fill="#64748b">(查無狀態送 unconfirmed)</text>
<text x="1215" y="776" font-size="10" fill="#64748b">(重裝間隔: 600 秒)</text>

<!-- 延遲派送箭頭往下匯流 -->
<path d="M 1290 790 V 835 H 850" fill="none" stroke="#b42318" stroke-width="2.5" marker-end="url(#arrow-red)"/>

<!-- 區域 4：範本替換引擎與使用者覆寫 -->
<rect x="40" y="835" width="1360" height="165" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="40" y="835" width="1360" height="38" rx="14" fill="#334155"/>
<text x="60" y="861" font-size="16" fill="#ffffff" font-weight="700">4. 訊息範本替換引擎與安全轉義 (Template Engine &amp; Escaping)</text>

<rect x="65" y="888" width="410" height="95" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="80" y="910" font-size="14" fill="#0f172a" font-weight="700">雙層範本載入優先序</text>
<text x="80" y="932" font-size="12" fill="#15803d">1. 使用者自訂：<tspan font-family="monospace">~/.config/ai-notify/templates/*.md</tspan> (最高優先)</text>
<text x="95" y="948" font-size="11" fill="#64748b">安裝、更新或卸載時永遠保留，絕不覆蓋使用者自訂文案</text>
<text x="80" y="968" font-size="12" fill="#334155">2. 內建預設：<tspan font-family="monospace">~/.config/ai-notify/hooks/templates/*.md</tspan> (回退備用)</text>

<rect x="495" y="888" width="460" height="95" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="510" y="910" font-size="14" fill="#0f172a" font-weight="700">動態變數注入與安全跳脫 (Escape)</text>
<text x="510" y="932" font-size="12" fill="#334155">• 支援參數：<tspan font-family="monospace">{tool} {project} {time} {request_tool} {delay} {tag} {message}</tspan></text>
<text x="510" y="950" font-size="12" fill="#334155">• 純字串變數替換，不使用 <tspan font-family="monospace">eval</tspan>，杜絕 Shell 代碼注入風險</text>
<text x="510" y="968" font-size="12" fill="#334155">• 自動對注入變數轉義 Telegram Markdown 特殊字符；空行自動修剪</text>

<rect x="975" y="888" width="405" height="95" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="990" y="910" font-size="14" fill="#0f172a" font-weight="700">主要訊息範本與中英標準文案</text>
<text x="990" y="930" font-size="11" fill="#334155">• <tspan font-family="monospace">authorization</tspan>: 🔴 Waiting for Your Approval (over 30s)</text>
<text x="990" y="946" font-size="11" fill="#334155">• <tspan font-family="monospace">authorization-unconfirmed</tspan>: 🟡 Approval Status Unknown</text>
<text x="990" y="962" font-size="11" fill="#334155">• <tspan font-family="monospace">complete</tspan>: 🟢 Task Complete | <tspan font-family="monospace">question</tspan>: 🟡 Action Required</text>
<text x="990" y="978" font-size="11" fill="#15803d">• <tspan font-family="monospace">handoff-*</tspan>: 🔵 Agent Handoff (含工具/模型/effort 與下一步)</text>

<!-- 往下連線至發送 -->
<path d="M 720 1000 V 1025" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

<!-- 區域 5：外部派送層 -->
<rect x="40" y="1030" width="1360" height="95" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
<rect x="40" y="1030" width="1360" height="34" rx="14" fill="#0369a1"/>
<text x="60" y="1053" font-size="15" fill="#ffffff" font-weight="700">5. 外部通知派送層 (Delivery Layer - Telegram Bot API)</text>

<text x="65" y="1085" font-size="14" fill="#0f172a" font-weight="600">非同步與 Fail-Soft 保障：</text>
<text x="250" y="1085" font-size="13" fill="#334155">使用 <tspan font-family="monospace" font-weight="600">curl --silent --max-time 4</tspan> 發送 HTTPS POST 至 Telegram API</text>
<text x="780" y="1085" font-size="13" fill="#334155">嚴格限制 4 秒超時 · 失敗時安靜退出 (exit 0) · 絕對不中斷或阻塞 Agent 的執行</text>
<text x="65" y="1108" font-size="12" fill="#64748b">憑證保管：<tspan font-family="monospace">~/.config/ai-notify/config</tspan> (權限 600，僅限擁有者讀寫，禁止進 Git) · 支援離線乾跑 (TELEGRAM_DRY_RUN=true)</text>

</g>
</svg>
