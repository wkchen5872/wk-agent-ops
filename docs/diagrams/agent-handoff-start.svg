<text x="40" y="1602" font-size="16" fill="#42556d" font-weight="400" text-anchor="start">• 角色範本在主 worktree 的 .agent-handoff/roles.yaml，不進 Git；覆寫參數只寫進本次的 loop.yaml。</text>
<text x="40" y="1630" font-size="16" fill="#42556d" font-weight="400" text-anchor="start">• ③、⑦、⑨ 由同一個核心依範本開 Session；prompt 依工具寫成 /skill（Claude Code）或 $skill（Codex）。</text>
<text x="40" y="1658" font-size="16" fill="#42556d" font-weight="400" text-anchor="start">• 審查者不在啟動時開：開 Session 一定要給第一個任務，而那時還沒有東西可審。</text>
<text x="40" y="1686" font-size="16" fill="#42556d" font-weight="400" text-anchor="start">• 同一個分支不能同時被兩個 worktree 使用：收尾 new 時 A 先分離在同一 commit。</text>
<text x="40" y="1730" font-size="15" fill="#5f7186" font-weight="400" text-anchor="start">handoff-start、handoff-write、hook 與 handoff-finish 已實作並通過自動測試；真實多 Agent 演練已通過。用法見 scripts/handoff/README.md。</text>
