<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1760" viewBox="0 0 1400 1760" role="img" aria-labelledby="title desc">
<title id="title">啟動一個交接迴圈：誰開什麼</title>
<desc id="desc">上方是三份角色範本：implement 由使用者的指令觸發，review 與 finish 由 Stop hook 觸發；每份範本定義工具、模型、effort、Session 名稱與 prompt，prompt 最後都要求執行 handoff-write 寫交件單。下方四欄：使用者下 handoff-start 指令；啟動腳本確認 Change 與分支、準備實作者 worktree、用核心加 implement 範本開實作者 Session 並送出 prompt、寫 loop.yaml；實作者第一次停下時，Stop hook 用核心加 review 範本開審查 Session（review 的 worktree 預設 shared，設為 new 時先開停在交件單 head 的審查 worktree），或沿用指定的 Session；之後每輪只通知切到新 head 或退回修正；pass 後通知使用者執行 handoff-finish，或在 trigger 為 auto 時由 hook 用 finish 範本開收尾 Session。腳本遇到分支問題時停下說明，hook 遇到卡住或超過三輪時透過 Telegram 找使用者。</desc>
