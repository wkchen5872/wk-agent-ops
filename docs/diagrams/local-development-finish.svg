<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1580" viewBox="0 0 1000 1580" role="img" aria-labelledby="title desc">
  <title id="title">04 封存與交付：已確認的本機開發流程</title>
  <desc id="desc">openspec-commit 先封存、更新文件並 commit，再依交付意圖分流：預設本地停止；成功交付依授權 push、update、確認最終 head 的 pass 後 reply Closure；取消或被取代只委派 github-pr close，不先 push。merge 與 Issue 結案另行處理。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#647a94" />
    </marker>
  </defs>
  <rect width="1000" height="1580" fill="#f5f7fb" />
  <g font-family="PingFang TC, Noto Sans CJK TC, sans-serif">
    <text x="65" y="78" font-size="39" fill="#19344c" font-weight="700">04 封存與交付</text>
    <text x="65" y="119" font-size="22" fill="#42556d" font-weight="400">已確認流程 · 遠端交付須搭配對應 Skill 實作</text>
    <rect x="785" y="38" width="145" height="45" rx="22" fill="#dcf2e5" />
    <text x="816" y="68" font-size="21" fill="#865b11" font-weight="600">已確認</text>
    <rect x="170" y="173" width="700" height="108" rx="18" fill="#ffffff" stroke="#b4c6d8" stroke-width="2" />
    <circle cx="126" cy="208" r="22" fill="#dce7f2" />
    <text x="113" y="216" font-size="20" fill="#294761" font-weight="600">01</text>
    <text x="194" y="208" font-size="27" fill="#19344c" font-weight="650">進入已驗收的 Change</text>
    <text x="194" y="240" font-size="21" fill="#42556d" font-weight="400">確認交付範圍與本輪封存／提交授權</text>
    <path d="M 520.0 284 V 305" fill="none" stroke="#647a94" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" />
    <rect x="170" y="317" width="700" height="108" rx="18" fill="#ffffff" stroke="#b4c6d8" stroke-width="2" />
    <circle cx="126" cy="352" r="22" fill="#dce7f2" />
    <text x="113" y="360" font-size="20" fill="#294761" font-weight="600">02</text>
    <text x="194" y="352" font-size="27" fill="#19344c" font-weight="650">封存 Change</text>
    <text x="194" y="384" font-size="21" fill="#42556d" font-weight="400">openspec-commit → openspec-archive-change</text>
    <path d="M 520.0 428 V 449" fill="none" stroke="#647a94" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" />
    <rect x="170" y="461" width="700" height="108" rx="18" fill="#ffffff" stroke="#b4c6d8" stroke-width="2" />
    <circle cx="126" cy="496" r="22" fill="#dce7f2" />
    <text x="113" y="504" font-size="20" fill="#294761" font-weight="600">03</text>
    <text x="194" y="496" font-size="27" fill="#19344c" font-weight="650">更新交付文件</text>
    <text x="194" y="528" font-size="21" fill="#42556d" font-weight="400">doc-updater；確認 archive 與 spec sync 結果</text>
    <path d="M 520.0 572 V 593" fill="none" stroke="#647a94" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" />
    <rect x="170" y="605" width="700" height="108" rx="18" fill="#fff5dc" stroke="#d2a14a" stroke-width="2" />
    <circle cx="126" cy="640" r="22" fill="#dce7f2" />
    <text x="113" y="648" font-size="20" fill="#294761" font-weight="600">04</text>
    <text x="194" y="640" font-size="27" fill="#19344c" font-weight="650">建立 Git commit</text>
    <text x="194" y="672" font-size="21" fill="#42556d" font-weight="400">git-commit-writer；通過必要檢查與提交 gate</text>
    <path d="M 520 716 V 755 H 187 V 793" fill="none" stroke="#647a94" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M 520 755 H 500 V 793" fill="none" stroke="#647a94" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" />
    <path d="M 520 755 H 813 V 793" fill="none" stroke="#647a94" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" />
    <rect x="52" y="805" width="270" height="320" rx="17" fill="#edf5ef" stroke="#91b89d" stroke-width="2" />
    <text x="72" y="846" font-size="24" fill="#243e54" font-weight="650">本地完成（預設）</text>
    <text x="72" y="894" font-size="20" fill="#42556d">到此停止</text>
    <text x="72" y="932" font-size="20" fill="#42556d">不需要 PR</text>
    <text x="72" y="970" font-size="20" fill="#42556d">遠端步驟另待授權</text>
    <rect x="365" y="805" width="270" height="320" rx="17" fill="#eaf3ff" stroke="#73a2d5" stroke-width="2" />
    <text x="385" y="846" font-size="24" fill="#243e54" font-weight="650">成功交付（授權）</text>
    <text x="385" y="894" font-size="20" fill="#42556d">push → 回讀 head</text>
    <text x="385" y="932" font-size="20" fill="#42556d">github-pr update</text>
    <text x="385" y="970" font-size="20" fill="#42556d">最終 head 須有 pass</text>
    <text x="385" y="1008" font-size="20" fill="#42556d">reply Closure</text>
    <text x="385" y="1062" font-size="20" fill="#42556d">等待另行授權 merge</text>
    <rect x="678" y="805" width="270" height="320" rx="17" fill="#fff2db" stroke="#d0ad6a" stroke-width="2" />
    <text x="698" y="846" font-size="24" fill="#243e54" font-weight="650">取消或被取代</text>
    <text x="698" y="894" font-size="20" fill="#42556d">明確授權與理由</text>
    <text x="698" y="932" font-size="20" fill="#42556d">github-pr close</text>
    <text x="698" y="970" font-size="20" fill="#42556d">先 Closure 再關閉</text>
    <text x="698" y="1008" font-size="20" fill="#42556d">不 push 放棄成果</text>
    <rect x="54" y="1200" width="892" height="300" rx="20" fill="#eaf0f7" />
    <text x="80" y="1238" font-size="24" fill="#294761" font-weight="650">執行邊界與交接</text>
    <text x="80" y="1276" font-size="20" fill="#42556d">• archive → docs → commit；本地完成不要求 PR。</text>
    <text x="80" y="1314" font-size="20" fill="#42556d">• 成功交付須有既有 PR 與授權；最終 head 缺 pass 就停在 Closure 前。</text>
    <text x="80" y="1352" font-size="20" fill="#42556d">• 新一輪 Review 另需授權；取消路徑不要求 pass。</text>
    <text x="80" y="1390" font-size="20" fill="#42556d">• merge、Issue 驗收、部署與分支清理各自處理。</text>
    <text x="80" y="1428" font-size="20" fill="#42556d">• 中斷先讀 archive／Git／remote head／PR，只補缺少且已授權步驟。</text>
    <text x="80" y="1466" font-size="20" fill="#42556d">• 圖例：三個分支擇一；箭頭表示順序，顏色僅輔助。</text>
    <text x="65" y="1545" font-size="18" fill="#6c7c90" font-weight="400">狀態：已確認流程；遠端交付實作另行交付，見 docs/workflow/local-development.md。</text>
  </g>
</svg>
