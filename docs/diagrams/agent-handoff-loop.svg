<text x="538" y="926" font-size="17" fill="#1f7a4d" font-weight="600" text-anchor="start">pass → 通知你（auto：開收尾）</text>
<text x="538" y="953" font-size="17" fill="#b42318" font-weight="600" text-anchor="start">changes-required → 通知實作者</text>
<text x="538" y="980" font-size="17" fill="#42556d" font-weight="400" text-anchor="start">blocked 或超過 3 輪 → 通知你</text>
<text x="538" y="1007" font-size="15" fill="#5f7186" font-weight="400" text-anchor="start">沒寫交件單也通知你</text>
