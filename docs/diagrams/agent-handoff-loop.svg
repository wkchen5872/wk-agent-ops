<rect x="40" y="1100" width="1320" height="296" rx="18" fill="#eef6f0"/>
<text x="62" y="1136" font-size="21" fill="#19344c" font-weight="700" text-anchor="start">收尾 · 你執行 handoff-finish（auto 時由 hook）開 Session：$openspec-commit {change}</text>
<text x="62" y="1164" font-size="17" fill="#42556d" font-weight="400" text-anchor="start">先確認 pass 對應 A 目前乾淨的 HEAD；預設在 A 進行，new 時 A 分離在同一 commit、新 worktree 接手分支</text>
<rect x="60" y="1188" width="236" height="172" rx="14" fill="#ffffff" stroke="#b4c6d8" stroke-width="2"/>
<text x="78" y="1222" font-size="21" fill="#19344c" font-weight="650" text-anchor="start">⑥ 封存</text>
<text x="78" y="1252" font-size="16" fill="#42556d" font-weight="400" text-anchor="start">openspec-archive-change</text>
<text x="78" y="1278" font-size="16" fill="#42556d" font-weight="400" text-anchor="start">同步規格</text>
<rect x="322" y="1188" width="236" height="172" rx="14" fill="#ffffff" stroke="#b4c6d8" stroke-width="2"/>
<text x="340" y="1222" font-size="21" fill="#19344c" font-weight="650" text-anchor="start">⑦ 文件</text>
<text x="340" y="1252" font-size="16" fill="#42556d" font-weight="400" text-anchor="start">doc-updater</text>
<text x="340" y="1278" font-size="16" fill="#42556d" font-weight="400" text-anchor="start">更新受影響的文件</text>
<rect x="584" y="1188" width="236" height="172" rx="14" fill="#ffffff" stroke="#b4c6d8" stroke-width="2"/>
<text x="602" y="1222" font-size="21" fill="#19344c" font-weight="650" text-anchor="start">⑧ commit</text>
<text x="602" y="1252" font-size="16" fill="#42556d" font-weight="400" text-anchor="start">git-commit-writer</text>
<text x="602" y="1278" font-size="16" fill="#42556d" font-weight="400" text-anchor="start">產生新的 commit</text>
<rect x="846" y="1188" width="236" height="172" rx="14" fill="#fffaf0" stroke="#d2a14a" stroke-width="2" stroke-dasharray="8 5"/>
<text x="864" y="1222" font-size="21" fill="#19344c" font-weight="650" text-anchor="start">⑨ PR 交付（選做）</text>
<text x="864" y="1250" font-size="16" fill="#9a3412" font-weight="600" text-anchor="start">需授權；有 PR 才做</text>
<text x="864" y="1274" font-size="16" fill="#42556d" font-weight="400" text-anchor="start">push 並回讀 head</text>
<text x="864" y="1298" font-size="16" fill="#42556d" font-weight="400" text-anchor="start">github-pr update</text>
<text x="864" y="1322" font-size="16" fill="#42556d" font-weight="400" text-anchor="start">最終版 Review（交付 head）</text>
<text x="864" y="1346" font-size="16" fill="#42556d" font-weight="400" text-anchor="start">Closure：可交付合併</text>
<rect x="1108" y="1188" width="236" height="172" rx="14" fill="#ffffff" stroke="#b4c6d8" stroke-width="2"/>
<text x="1126" y="1222" font-size="21" fill="#19344c" font-weight="650" text-anchor="start">⑩ 交件、通知你</text>
<text x="1126" y="1252" font-size="16" fill="#42556d" font-weight="400" text-anchor="start">執行 handoff-write</text>
<text x="1126" y="1278" font-size="16" fill="#42556d" font-weight="400" text-anchor="start">--role finish</text>
<text x="1126" y="1304" font-size="16" fill="#42556d" font-weight="400" text-anchor="start">hook 通知你結果</text>
<path d="M 296 1274 H 312" fill="none" stroke="#647a94" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 558 1274 H 574" fill="none" stroke="#647a94" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 820 1274 H 836" fill="none" stroke="#647a94" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<path d="M 1082 1274 H 1098" fill="none" stroke="#647a94" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<path d="M 702 1360 V 1378 H 1226 V 1366" fill="none" stroke="#647a94" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="1412" width="1320" height="52" rx="14" fill="#f1f2f6" stroke="#9a9db3" stroke-width="2" stroke-dasharray="8 5"/>
<text x="58" y="1446" font-size="17" fill="#19344c" font-weight="650" text-anchor="start">不在本流程，各自另行授權：merge 回 main、關 Issue（github-issue close）、刪 worktree 與分支</text>
<text x="40" y="1504" font-size="17" fill="#42556d" font-weight="400" text-anchor="start">• worktree 決定看到哪些檔案，Session 決定記得什麼：每輪只換 commit，不換 Agent。</text>
<text x="40" y="1532" font-size="17" fill="#42556d" font-weight="400" text-anchor="start">• 達 3 輪上限時 hook 停止自動修正並通知你；新 Session 靠交件單與報告路徑接手。</text>
<text x="40" y="1560" font-size="17" fill="#42556d" font-weight="400" text-anchor="start">• 交件單由 handoff-write 寫入 .agent-handoff/&lt;change&gt;/，每輪一個檔案；hook 在 Agent 自己的工作目錄執行，直接讀得到。</text>
<text x="40" y="1588" font-size="17" fill="#42556d" font-weight="400" text-anchor="start">• hook 只在新開的 Session 生效；Codex 的新 hook 要你信任一次。所有 GitHub 寫入都在有回讀規則的 Skill 裡。</text>
<text x="40" y="1616" font-size="17" fill="#42556d" font-weight="400" text-anchor="start">• hook 具備獨立進度通知；傳訊或開 Session 失敗時發送不可關閉的 attention 通知並保留交件單供重試。</text>
<text x="40" y="1660" font-size="15" fill="#5f7186" font-weight="400" text-anchor="start">handoff-write、hook、handoff-start 與 handoff-finish 已實作並通過自動測試；真實多 Agent 演練已通過。用法見 scripts/handoff/README.md。</text>
</g></svg>
