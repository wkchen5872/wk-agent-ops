<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1690" viewBox="0 0 1400 1690" role="img" aria-labelledby="title desc">
<title id="title">實作、Review、收尾：交接流程</title>
<desc id="desc">三個直欄：左邊是實作者，在 worktree A 的 feature branch 上用 openspec-apply-change 實作，完成後本機 commit 並執行 handoff-write 寫交件單；中間是 Agent 停下時自動執行的 Stop hook，不輪詢、不用模型、不寫 GitHub，讀交件單，透過接收角色的 host（Xirp、herdr 或 Herdr 桌面 app）通知下一個 Agent；右邊是審查者，預設與實作者共用 worktree A，設為 new 時在另開的 worktree B 停在交件單指定的 commit；先確認 HEAD 等於交件單的 head 且乾淨，再用 change-review 審查，有 PR 時由 change-review 發布並回讀回覆，最後執行 handoff-write。結論是 changes-required 時 hook 把報告路徑轉給實作者；pass 時 hook 通知使用者執行 handoff-finish（trigger 設為 auto 時由 hook 直接開），收尾 Session 執行 openspec-commit：封存、文件、commit，選做且需授權的 PR 交付包含 push、github-pr update、最終版 Review 與 Closure，最後寫交件單由 hook 通知使用者。merge、關 Issue、刪 worktree 不在本流程。</desc>
