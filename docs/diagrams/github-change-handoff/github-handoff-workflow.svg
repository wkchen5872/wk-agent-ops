<text x="70" y="119" font-size="24" font-weight="400" fill="#52647a" text-anchor="start">2026-11-13 探索流程｜保留當時的 Draft PR、phase 與發布設計；非現行操作契約</text>
<rect x="70" y="157" width="520" height="58" rx="12" fill="#eaf5f4" stroke="none"/>
<text x="94" y="195" font-size="25" font-weight="650" fill="#087e83" text-anchor="start">本機 Local：規劃與實作</text>
<rect x="780" y="157" width="520" height="58" rx="12" fill="#edf1fc" stroke="none"/>
<text x="804" y="195" font-size="25" font-weight="650" fill="#355fcb" text-anchor="start">GitHub：Issue、分支與 PR</text>
