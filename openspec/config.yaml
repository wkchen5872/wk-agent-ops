schema: spec-driven

context: |
  遵循 AGENTS.md 中的三層工程規範（Level 1/2/3）。
  TDD 強制執行：參考 .claude/rules/tdd-enforcement.md。
  若功能涉及 Hook 腳本，需參考 .claude/rules/multi-tool-compatibility.md。

rules:
  proposal:
    - 說明功能範圍與驗收條件。若涉及 Hook 腳本，需列出支援的 AI CLI 工具。
  design:
    - 說明模組設計與資料流，需包含 TDD 策略與測試邊界。
  tasks:
    - 每個 task 需包含「測試要求」欄位，apply 時依 .claude/rules/tdd-enforcement.md 執行。
  specs:
    - 規格需包含可驗證的 acceptance criteria。
